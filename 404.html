<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to GitDelivr...</title>
    <script>
        // Purane deep path aur search queries (?url= ya ?v=) ko extract karke naye domain par redirect karna
        var newDomain = "https://gitdelivr.in";
        var currentPath = window.location.pathname;
        var currentSearch = window.location.search;
        
        // Instant hard-redirect
        window.location.replace(newDomain + currentPath + currentSearch);
    </script>
</head>
<body>
    <p>Redirecting to new infrastructure... <a href="https://gitdelivr.in">Click here</a> if not redirected.</p>
</body>
</html>
